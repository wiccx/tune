<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tune Finder</title>
<style>
:root{--h:320;--top:300px;--accent:hsl(var(--h) 100% 66%);--ink:#eef0ff;--muted:#c9cee3;--glass:transparent;--edge:rgba(255,255,255,.35);color-scheme:dark}
*{box-sizing:border-box}
html{background:#000}body,html{margin:0}body{background:transparent}
body{color:var(--ink);font:16px/1.45 "Trebuchet MS",system-ui,sans-serif;text-shadow:0 1px 3px #000,0 0 10px #000;max-width:760px;margin:0 auto;padding:var(--top) 16px calc(40px + env(safe-area-inset-bottom,0px));min-height:100vh}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
body>*:not(#sky):not(h1):not(#brand){position:relative;z-index:1}
h1{z-index:1}
h1{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;margin:0;font-size:1.5rem;font-weight:800;letter-spacing:.18em;text-shadow:0 0 18px var(--accent)}
.glass{background:transparent;border:1px solid var(--edge);border-radius:16px}
form{display:flex;flex-wrap:wrap;gap:8px;padding:8px}
input{-webkit-appearance:none;appearance:none;flex:1;min-width:0;font:inherit;padding:12px 14px;border:0;border-radius:10px;background:transparent;color:var(--ink)}
input::placeholder{color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:var(--accent);color:#0a0714;font-weight:800;box-shadow:0 0 18px var(--accent);transition:transform .15s}
button:active{transform:scale(.94)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:none;align-items:center;gap:8px;margin:14px 0 6px;padding:6px 8px;border:1px solid var(--edge);border-radius:16px}
.bar button{background:transparent;color:var(--ink);border:1px solid var(--edge);box-shadow:none;padding:0;width:44px;height:44px;flex:none;border-radius:50%;font-size:1rem;text-shadow:none}
.bar input{padding:0;accent-color:var(--accent);height:44px}
#time{min-width:2.6em;text-align:right;font-size:.85rem;color:var(--muted)}
.src{display:flex;gap:8px;flex:0 0 100%}
.src button{background:transparent;color:var(--ink);border:1px solid var(--edge);box-shadow:none;padding:8px 16px;font-weight:600;text-shadow:none}
.src button.on{border-color:var(--accent);box-shadow:0 0 14px -2px var(--accent)}
.bar a.dl{display:none;align-items:center;justify-content:center;flex:none;width:44px;height:44px;border:1px solid var(--accent);border-radius:50%;color:var(--ink);text-decoration:none;font-size:1.05rem;text-shadow:none;box-shadow:0 0 12px -2px var(--accent)}
.tools{display:none;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 6px}
.tools button,.chips button{background:transparent;color:var(--ink);border:1px solid var(--edge);box-shadow:none;text-shadow:none}
.tools button{padding:0;width:40px;height:40px;border-radius:50%;font-size:1rem}
.tools button.on{border-color:var(--accent);box-shadow:0 0 12px -2px var(--accent)}
.tools input{flex:1;min-width:90px;height:40px;padding:0;accent-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips button{padding:6px 14px;font-weight:600;font-size:.85rem}
#ytwrap{display:none;aspect-ratio:16/9;border-radius:12px;overflow:hidden;margin:8px 0;border:1px solid var(--edge)}
#ytwrap iframe{width:100%;height:100%;display:block}
#now{margin:8px 2px 12px;color:var(--muted);min-height:1.4em}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{animation:in .4s both}
@keyframes in{from{opacity:0;transform:translateX(-22px) scale(.97)}to{opacity:1;transform:none}}
li button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--edge);padding:8px;font-weight:400;box-shadow:none;min-height:60px}
li button:hover{border-color:var(--accent)}
li button.on{border-color:var(--accent);box-shadow:0 0 22px -4px var(--accent),inset 4px 0 0 var(--accent)}
li img{width:54px;height:54px;object-fit:cover;border-radius:50%;flex:none;background:rgba(255,255,255,.1)}
li b{display:block}
li span{color:var(--muted);font-size:.85rem}
.msg{color:var(--muted);text-align:center;padding:0 8px}
#brand{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2;font-size:.85rem;font-weight:800;letter-spacing:.2em;color:var(--ink);opacity:.45;pointer-events:none}
@media (max-width:480px){h1{font-size:1.1rem;letter-spacing:.14em}body{padding-left:12px;padding-right:12px}button{padding:12px 14px}li img{width:48px;height:48px}li b{font-size:.95rem}}
@media (prefers-reduced-motion:reduce){li{animation:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<h1>TUNE FINDER</h1>
<div id="brand">WICCX</div>
<form id="f" class="glass">
  <div id="src" class="src" role="group" aria-label="Music source">
    <button type="button" data-s="yt" class="on">YouTube</button>
    <button type="button" data-s="au">Audius</button>
    <button type="button" data-s="fav">My music</button>
  </div>
  <input id="q" list="rec" type="search" placeholder="Song, artist or genre" aria-label="Search music" autocomplete="off">
  <button>Search</button>
</form>
<datalist id="rec"></datalist>
<div class="chips" id="moods">
  <button type="button" data-m="lofi focus instrumental">Focus</button>
  <button type="button" data-m="chill vibes">Chill</button>
  <button type="button" data-m="workout energy">Workout</button>
  <button type="button" data-m="party dance hits">Party</button>
  <button type="button" id="inst" style="display:none">Install app</button>
</div>
<div id="bar" class="bar">
  <button id="prev" aria-label="Previous track">&#x23EE;&#xFE0E;</button>
  <button id="pp" aria-label="Play or pause">&#x25B6;&#xFE0E;</button>
  <button id="next" aria-label="Next track">&#x23ED;&#xFE0E;</button>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
  <span id="time">0:00</span>
  <a id="dl" class="dl" href="#" target="_blank" rel="noopener" aria-label="Download this track" title="Free download">&#x2B07;&#xFE0E;</a>
</div>
<div id="tools" class="tools">
  <button id="fav" aria-label="Save to My music">&#x2661;&#xFE0E;</button>
  <button id="shuf" aria-label="Shuffle">&#x21C4;&#xFE0E;</button>
  <button id="rep" aria-label="Repeat">&#x21BB;&#xFE0E;</button>
  <button id="shr" aria-label="Share">&#x2934;&#xFE0E;</button>
  <button id="slp" aria-label="Sleep timer">&#x23F2;&#xFE0E;</button>
  <input id="vol" type="range" min="0" max="100" value="100" aria-label="Volume">
</div>
<audio id="aud"></audio>
<div id="ytwrap"><div id="yt"></div></div>
<p id="now"></p>
<ul id="list"></ul>
<p class="msg" id="msg">Search for a song and each song flies to the next planet. YouTube has the biggest catalog. Audius has independent music, and tracks marked free download can be saved.</p>

<script>
const $=id=>document.getElementById(id);

/* ---------- first-person solar system ---------- */
const cv=$('sky'),ctx=cv.getContext('2d');
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches?0.1:0.3;
const PL=[
 {n:'Mercury',h:205,r:62, sz:3.2,c:['#e4f0ff','#7d96c4','#0a1126'],w:.0005},
 {n:'Venus',  h:245,r:88, sz:5.2,c:['#e4f0ff','#7d96c4','#0a1126'],w:.00037,atm:'170,200,255'},
 {n:'Earth',  h:210,r:116,sz:5.6,c:['#e4f0ff','#7d96c4','#0a1126'],w:.0003,atm:'90,160,255',moons:[{d:13,w:.0016,s:1.3}]},
 {n:'Mars',   h:195,r:144,sz:4.4,c:['#e4f0ff','#7d96c4','#0a1126'],w:.00024},
 {n:'Jupiter',h:220,r:196,sz:13, c:['#e4f0ff','#7d96c4','#0a1126'],w:.00014,spin:.02,moons:[{d:26,w:.0013,s:1.6},{d:33,w:.0008,s:1.4}]},
 {n:'Saturn', h:235,r:250,sz:10, c:['#e4f0ff','#7d96c4','#0a1126'],w:.00011,ring:1},
 {n:'Uranus', h:185,r:298,sz:7.5,c:['#e4f0ff','#7d96c4','#0a1126'],w:.00008,atm:'150,230,255'},
 {n:'Neptune',h:225,r:340,sz:7.3,c:['#e4f0ff','#7d96c4','#0a1126'],w:.000065,atm:'60,110,255'}
];
const PSZ=1.4,SUN=22,MOONC={c:['#eaf2ff','#7d96c4','#0a1126']};

/* procedural surfaces, drawn once into small canvases */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(seed,fn){const c=document.createElement('canvas');c.width=512;c.height=256;fn(c.getContext('2d'),rng(seed),512,256);return c}
const wrapX=x=>[x,x-512,x+512];
function blob(g,x,y,r,rgb,al){for(const xx of wrapX(x)){if(xx+r<0||xx-r>512)continue;const gr=g.createRadialGradient(xx,y,0,xx,y,r);gr.addColorStop(0,`rgba(${rgb},${al})`);gr.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=gr;g.fillRect(xx-r,y-r,r*2,r*2)}}
function crater(g,x,y,r){for(const xx of wrapX(x)){if(xx+r<0||xx-r>512)continue;const gr=g.createRadialGradient(xx-r*.25,y-r*.25,r*.1,xx,y,r);gr.addColorStop(0,'rgba(0,10,50,.55)');gr.addColorStop(.8,'rgba(0,10,50,.22)');gr.addColorStop(1,'rgba(255,255,255,.4)');g.fillStyle=gr;g.beginPath();g.arc(xx,y,r,0,7);g.fill()}}
function streak(g,x,y,rx,ry,rot,col){g.fillStyle=col;for(const xx of wrapX(x)){if(xx+rx<0||xx-rx>512)continue;g.beginPath();g.ellipse(xx,y,rx,ry,rot,0,7);g.fill()}}
function disc(g,x,y,r,col){g.fillStyle=col;for(const xx of wrapX(x)){if(xx+r<0||xx-r>512)continue;g.beginPath();g.arc(xx,y,r,0,7);g.fill()}}
function vgrad(g,h,stops){const gr=g.createLinearGradient(0,0,0,h);stops.forEach(p=>gr.addColorStop(p[0],p[1]));g.fillStyle=gr;g.fillRect(0,0,512,h)}
const T={
  moon(seed,c1,c2){return mk(seed,(g,R,w,h)=>{
    vgrad(g,h,[[0,c1],[1,c2]]);
    for(let i=0;i<16;i++)blob(g,R()*w,h*(.2+.6*R()),30+R()*50,'10,30,90',.28);
    for(let i=0;i<110;i++)crater(g,R()*w,h*(.1+.8*R()),2+R()*R()*22);
  })},
  gas(seed,pal,o){return mk(seed,(g,R,w,h)=>{
    const st=[];for(let i=0;i<=14;i++)st.push([i/14,pal[Math.floor(R()*pal.length)]]);
    vgrad(g,h,st);
    for(let i=0;i<90;i++){const lite=R()<.5;streak(g,R()*w,R()*h,15+R()*70,1.5+R()*5,(R()-.5)*.1,lite?`rgba(255,255,255,${.05+R()*.14})`:`rgba(0,20,90,${.06+R()*.16})`)}
    if(o.storm){streak(g,w*.62,h*.64,40,20,0,'rgba(235,245,255,.45)');streak(g,w*.62,h*.64,26,12,0,'rgba(20,60,160,.55)');streak(g,w*.62,h*.64,12,6,0,'rgba(235,245,255,.5)')}
    if(o.swirl)for(let k=1;k<=5;k++){g.strokeStyle=`rgba(255,255,255,${.55-k*.08})`;g.lineWidth=2;g.beginPath();g.ellipse(w*.5,h*.88,k*7,k*4,0,0,Math.PI*1.7);g.stroke()}
  })},
  earth(){return mk(11,(g,R,w,h)=>{
    vgrad(g,h,[[0,'#0a2f7a'],[.5,'#1f72e6'],[1,'#0a2f7a']]);
    for(let c=0;c<9;c++){
      const cx=R()*w,cy=h*(.22+.56*R()),bl=[];
      for(let i=0;i<12+Math.floor(R()*8);i++)bl.push([cx+(R()-.5)*80,cy+(R()-.5)*44,9+R()*20]);
      for(const b of bl)disc(g,b[0],b[1],b[2]+3,'rgba(190,175,115,.95)');
      for(const b of bl)disc(g,b[0],b[1],b[2],'rgba(70,145,95,.95)');
    }
    for(let i=0;i<170;i++)streak(g,R()*w,R()*h,12+R()*50,2+R()*6,(R()-.5)*.5,`rgba(255,255,255,${.18+R()*.3})`);
    let gr=g.createLinearGradient(0,0,0,h*.14);gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,w,h*.14);
    gr=g.createLinearGradient(0,h,0,h*.86);gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,h*.86,w,h*.14);
  })},
  sun(){return mk(5,(g,R,w,h)=>{
    vgrad(g,h,[[0,'#ffb02e'],[.5,'#ffc94a'],[1,'#ff9a1a']]);
    for(let i=0;i<160;i++)blob(g,R()*w,R()*h,8+R()*34,'255,240,160',.18+R()*.25);
    for(let i=0;i<110;i++)blob(g,R()*w,R()*h,8+R()*30,'200,70,0',.2+R()*.25);
    for(let i=0;i<300;i++)blob(g,R()*w,R()*h,2+R()*5,'255,252,220',.35);
  })}
};
PL[0].tex=T.moon(1,'#f3f7ff','#8ea8d8');
PL[1].tex=T.gas(2,['#d6e4ff','#b4c8f6','#eef3ff','#9fb6ec'],{});
PL[2].tex=T.earth();
PL[3].tex=T.moon(4,'#9fb9e8','#3f5a96');
PL[4].tex=T.gas(5,['#a9c8ff','#2f63d6','#dbe8ff','#1b3fa8','#6fa0f0'],{storm:1});
PL[5].tex=T.gas(6,['#e3edff','#b8cdf2','#a2bbe6','#d2e0f8'],{swirl:1});
PL[6].tex=T.gas(7,['#c8f6ff','#8fdcf0','#5cc2e6'],{});
PL[7].tex=T.gas(8,['#0a2480','#1747c9','#2f6bff','#0b1f66','#5b8cff'],{storm:1});
const SUNTEX=T.sun();

PL.forEach((p,k)=>p.a=k*.9+1);
const S={hue:210,target:210,pulse:0,focus:-1,playing:false,prog:0,pe:0};
let W,H,cx,cy,F,sunR,fr,shownHue=-1,camP=null,camT=null,fromP=null,fromT=null,tr=1,lastFocus=-1,lastT=0;

// stars live on a sphere around the camera, with a dense band like the Milky Way
const sky=Array.from({length:1800},(_,i)=>{
  let x,y,z;
  if(i%100<62){
    const a=Math.random()*6.283,b=(Math.random()+Math.random()+Math.random()-1.5)*.17;
    const px=Math.cos(a)*Math.cos(b),py=Math.sin(b),pz=Math.sin(a)*Math.cos(b),c=Math.cos(.5),sn=Math.sin(.5);
    x=px*c-py*sn;y=px*sn+py*c;z=pz;
  }else{
    y=Math.random()*2-1;const a=Math.random()*6.283,r=Math.sqrt(1-y*y);x=Math.cos(a)*r;z=Math.sin(a)*r;
  }
  return{x,y,z,m:Math.random(),t:Math.random()*3|0};
});
const SPR=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(200,215,255,1)');r.addColorStop(1,'rgba(200,215,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return c})();
const glow=sky.filter((s,i)=>i%100<62&&i%12===0);
const belt=Array.from({length:260},()=>({a:Math.random()*6.283,r:164+Math.random()*20,y:(Math.random()-.5)*4,s:Math.random()*.5+.3}));

function resize(){
  const dpr=Math.min(devicePixelRatio||1,1.5);
  W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=W/2;cy=Math.max(125,Math.min(H*.3,250));
  F=Math.min(Math.max(W,H*.75),1100);
  sunR=Math.min(W*.3,130);fr=Math.min(70,W*.19);
  document.documentElement.style.setProperty('--top',Math.round(cy+Math.max(sunR,fr*1.6)+34)+'px');
}
addEventListener('resize',resize);resize();

function basis(P,T){
  let fx=T.x-P.x,fy=T.y-P.y,fz=T.z-P.z;const fl=Math.hypot(fx,fy,fz)||1;fx/=fl;fy/=fl;fz/=fl;
  let rx=-fz,rz=fx;const rl=Math.hypot(rx,rz)||1;rx/=rl;rz/=rl;
  return{f:[fx,fy,fz],r:[rx,0,rz],u:[-rz*fy,rz*fx-rx*fz,rx*fy]};
}
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];

function drawTex(tex,X,Y,rad,off){
  const k=2*rad/tex.height,w=tex.width*k,x0=X-rad-(((off*k)%w)+w)%w;
  ctx.drawImage(tex,x0,Y-rad,w,2*rad);ctx.drawImage(tex,x0+w,Y-rad,w,2*rad);
}
function sphere(pl,X,Y,rad,t,dx,dy,lz){
  ctx.save();ctx.beginPath();ctx.arc(X,Y,rad,0,7);ctx.clip();
  let g;
  if(pl.tex)drawTex(pl.tex,X,Y,rad,t*(pl.spin||.012)*calm);
  else{
    g=ctx.createRadialGradient(X+dx*rad*.55,Y+dy*rad*.55,rad*.05,X+dx*rad*.3,Y+dy*rad*.3,rad*1.7);
    g.addColorStop(0,pl.c[0]);g.addColorStop(.5,pl.c[1]);g.addColorStop(1,pl.c[2]);
    ctx.fillStyle=g;ctx.fillRect(X-rad,Y-rad,rad*2,rad*2);
  }
  g=ctx.createRadialGradient(X+dx*rad*.35,Y+dy*rad*.35,rad*.05,X+dx*rad*.35,Y+dy*rad*.35,rad*.9);
  g.addColorStop(0,'rgba(255,255,255,.16)');g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(X-rad,Y-rad,rad*2,rad*2);
  g=ctx.createRadialGradient(X+dx*rad*.4,Y+dy*rad*.4,rad*.6,X,Y,rad*1.15);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,2,24,.9)');
  ctx.fillStyle=g;ctx.fillRect(X-rad,Y-rad,rad*2,rad*2);
  if(lz>0){ctx.fillStyle=`rgba(0,2,24,${Math.min(.8,lz*.7)})`;ctx.fillRect(X-rad,Y-rad,rad*2,rad*2)}
  ctx.restore();
}

function ringHalf(X,Y,rad,ratio,near,top){
  const a0=top?Math.PI:0,a1=top?Math.PI*2:Math.PI;
  const rings=[[1.45,.2,'rgba(150,180,235,.55)'],[1.72,.3,'rgba(205,225,255,.8)'],[1.97,.05,'rgba(0,8,40,.75)'],[2.2,.3,'rgba(185,208,250,.75)']];
  for(const q of rings){
    ctx.lineWidth=Math.max(.8,rad*q[1]*Math.max(ratio,.35));ctx.strokeStyle=q[2];
    ctx.beginPath();ctx.ellipse(X,Y,rad*q[0],rad*q[0]*ratio,0,a0,a1);ctx.stroke();
  }
}

function lightVec(p,B){
  const L=Math.hypot(p.x,p.y,p.z)||1,v=[-p.x/L,-p.y/L,-p.z/L];
  return{dx:dot(v,B.r),dy:-dot(v,B.u),lz:dot(v,B.f)};
}

function frame(t){
  S.hue+=((((S.target-S.hue)%360)+540)%360-180)*.05;
  S.pulse*=.93;
  if(Math.round(S.hue)!==shownHue){shownHue=Math.round(S.hue);document.documentElement.style.setProperty('--h',((shownHue%360)+360)%360)}

  const q=PL.map(p=>{const a=p.a+t*p.w*calm;return{x:Math.cos(a)*p.r,y:0,z:Math.sin(a)*p.r}});
  let TP,TT;
  if(S.focus<0){
    const D=SUN*F/sunR;TT={x:0,y:0,z:0};TP={x:Math.sin(.35)*D,y:D*.07,z:Math.cos(.35)*D};
  }else{
    const pl=PL[S.focus],p=q[S.focus],rw=pl.sz*PSZ,r0=fr*.55*(pl.ring?.62:1),r1=Math.min(fr*1.6,W*.3);
    S.pe+=(S.prog-S.pe)*(1-Math.exp(-Math.min(50,t-lastT)/700));
    const D=rw*F/(r0*Math.pow(r1/r0,S.pe*S.pe*(3-2*S.pe)));
    const L=Math.hypot(p.x,p.z)||1,sx=-p.x/L,sz=-p.z/L,c=Math.cos(.7),sn=Math.sin(.7);
    TT=p;TP={x:p.x+(sx*c-sz*sn)*D,y:D*.2,z:p.z+(sx*sn+sz*c)*D};
  }
  // glide from where the camera was to the new target, then follow the planet exactly
  const dt=Math.min(50,t-lastT);lastT=t;
  if(!camP){camP={...TP};camT={...TT};tr=1;lastFocus=S.focus}
  if(S.focus!==lastFocus){fromP={...camP};fromT={...camT};tr=0;lastFocus=S.focus}
  tr=Math.min(1,tr+dt/7000);
  const sm=tr*tr*(3-2*tr);
  for(const k of['x','y','z']){
    camP[k]=fromP?fromP[k]+(TP[k]-fromP[k])*sm:TP[k];
    camT[k]=fromT?fromT[k]+(TT[k]-fromT[k])*sm:TT[k];
  }
  const B=basis(camP,camT),P=camP;
  const proj=(x,y,z)=>{
    const d=[x-P.x,y-P.y,z-P.z],zz=dot(d,B.f);
    if(zz<.5)return null;
    return{X:cx+dot(d,B.r)/zz*F,Y:cy-dot(d,B.u)/zz*F,z:zz};
  };

  ctx.fillStyle='#01020b';ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.05;
  const f0=B.f[0],f1=B.f[1],f2=B.f[2],r0=B.r[0],r2=B.r[2],u0=B.u[0],u1=B.u[1],u2=B.u[2];
  for(const s of glow){
    const zz=s.x*f0+s.y*f1+s.z*f2;if(zz<.05)continue;
    const X=cx+(s.x*r0+s.z*r2)/zz*F,Y=cy-(s.x*u0+s.y*u1+s.z*u2)/zz*F,z=F*.2;
    ctx.drawImage(SPR,X-z/2,Y-z/2,z,z);
  }
  ctx.globalAlpha=1;
  for(const s of sky){
    const zz=s.x*f0+s.y*f1+s.z*f2;
    if(zz<.05)continue;
    const X=cx+(s.x*r0+s.z*r2)/zz*F,Y=cy-(s.x*u0+s.y*u1+s.z*u2)/zz*F;
    if(X<-5||X>W+5||Y<-5||Y>H+5)continue;
    const m=s.m*s.m*s.m;
    ctx.fillStyle=`rgba(${['255,255,255','190,215,255','255,226,190'][s.t]},${.2+.8*m})`;
    const z=.6+1.3*m;ctx.fillRect(X,Y,z,z);
  }
  ctx.fillStyle='rgba(185,205,245,.7)';
  for(const b of belt){
    const a=b.a+t*.00012*calm,pr=proj(Math.cos(a)*b.r,b.y,Math.sin(a)*b.r);
    if(!pr||pr.X<0||pr.X>W||pr.Y<0||pr.Y>H)continue;
    const z=Math.min(6,Math.max(.8,b.s*F/pr.z*.4));ctx.fillRect(pr.X,pr.Y,z,z);
  }

  const objs=[{k:'sun',p:{x:0,y:0,z:0}}];
  PL.forEach((pl,k)=>{
    objs.push({k:'pl',i:k,p:q[k]});
    if(pl.moons)for(const m of pl.moons){
      const a=t*m.w*calm+k;
      objs.push({k:'moon',m,p:{x:q[k].x+Math.cos(a)*m.d,y:0,z:q[k].z+Math.sin(a)*m.d}});
    }
  });
  for(const o of objs){const pr=proj(o.p.x,o.p.y,o.p.z);o.pr=pr;o.zz=pr?pr.z:-1}
  objs.sort((m,n)=>n.zz-m.zz);

  for(const o of objs){
    const pr=o.pr;if(!pr)continue;
    const X=pr.X,Y=pr.Y;
    if(o.k==='sun'){
      const rad=SUN/pr.z*F;
      if(X<-rad*8||X>W+rad*8||Y<-rad*8||Y>H+rad*8||rad>W*8)continue;
      let g=ctx.createRadialGradient(X,Y,rad*.7,X,Y,rad*5);
      g.addColorStop(0,'rgba(255,170,60,.55)');g.addColorStop(.35,'rgba(255,120,20,.22)');g.addColorStop(1,'rgba(255,110,10,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(X,Y,rad*5,0,7);ctx.fill();
      ctx.save();ctx.beginPath();ctx.arc(X,Y,rad,0,7);ctx.clip();
      drawTex(SUNTEX,X,Y,rad,t*.02*calm);
      g=ctx.createRadialGradient(X,Y,rad*.45,X,Y,rad);
      g.addColorStop(0,'rgba(255,120,0,0)');g.addColorStop(1,'rgba(190,50,0,.55)');
      ctx.fillStyle=g;ctx.fillRect(X-rad,Y-rad,rad*2,rad*2);
      ctx.restore();
    }else if(o.k==='pl'){
      const pl=PL[o.i],rad=Math.max(.8,pl.sz*PSZ/pr.z*F);
      if(X<-rad*4||X>W+rad*4||Y<-rad*4||Y>H+rad*4||rad>W*6)continue;
      const lv=lightVec(o.p,B);
      let ratio=0,topNear=false;
      if(pl.ring){ratio=Math.max(.12,Math.abs(B.f[1]));topNear=B.f[1]>0}
      if(pl.atm){
        const g=ctx.createRadialGradient(X,Y,rad*.97,X,Y,rad*1.14);
        g.addColorStop(0,`rgba(${pl.atm},.4)`);g.addColorStop(1,`rgba(${pl.atm},0)`);
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(X,Y,rad*1.14,0,7);ctx.fill();
      }
      if(pl.ring)ringHalf(X,Y,rad,ratio,false,!topNear);
      sphere(pl,X,Y,rad,t,lv.dx,lv.dy,lv.lz);
      if(pl.ring)ringHalf(X,Y,rad,ratio,true,topNear);
    }else{
      const rad=Math.max(.7,o.m.s*PSZ/pr.z*F);
      if(X<-rad||X>W+rad||Y<-rad||Y>H+rad||rad>W*6)continue;
      const lv=lightVec(o.p,B);
      sphere(MOONC,X,Y,rad,t,lv.dx,lv.dy,lv.lz);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- music (YouTube + Audius) ---------- */
const KEY='AIzaSyDT1RhbmVLdxJHzTqU33Zm3t3Zy6rXvwx0';
const PROXY='https://tunes.sinstixe.workers.dev';   // paste your relay address here (see the guide), for example 'https://tunes.yourname.workers.dev'
const API=(PROXY?PROXY+'/a':'https://api.audius.co')+'/v1',APP='tune-finder';
const px=u=>PROXY&&u?PROXY+'/i?u='+encodeURIComponent(u):u;
const bar=$('bar'),pp=$('pp'),seek=$('seek'),tm=$('time'),dl=$('dl'),aud=$('aud');
const PAUSE='&#x23F8;&#xFE0E;',PLAY='&#x25B6;&#xFE0E;';
let source='yt',cur=null,results=[],idx=-1,yt=null,ytReady=false,pending=null,seeking=false;
const fmt=x=>isFinite(x)?Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0'):'0:00';
const decode=x=>{const t=document.createElement('textarea');t.innerHTML=x;return t.value};

document.querySelectorAll('#src button').forEach(b=>b.onclick=()=>{
  if(b.dataset.s==='fav'){document.querySelectorAll('#src button').forEach(x=>x.classList.toggle('on',x===b));showFavs();return}
  source=b.dataset.s;
  document.querySelectorAll('#src button').forEach(x=>x.classList.toggle('on',x===b));
  if($('q').value.trim())doSearch(false);
  else $('msg').textContent='Searching with '+(source==='yt'?'YouTube':'Audius')+'. Type a song to start.';
});

const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=()=>{
  yt=new YT.Player('yt',{width:'100%',height:'100%',playerVars:Object.assign({playsinline:1,autoplay:1,rel:0},/^https?:$/.test(location.protocol)?{origin:location.origin}:{}),events:{
    onReady:()=>{ytReady=true;if(pending!==null){const p=pending;pending=null;play(p,true)}},
    onStateChange:e=>{
      if(cur!=='yt')return;
      S.playing=e.data===1;
      pp.innerHTML=e.data===1?PAUSE:PLAY;
      if(e.data===0)autoNext();
    },
    onError:e=>{
      if(cur!=='yt')return;
      const n=$('now'),id=results[idx]&&results[idx].id,link=id?' <a href="https://www.youtube.com/watch?v='+id+'" target="_blank" rel="noopener" style="color:var(--accent)">Open on YouTube</a>':'';
      if(e.data===153||e.data===152||location.protocol==='file:'){
        n.innerHTML='YouTube blocked the player (error '+e.data+'). This happens when the page is opened as a file. Upload it to a website such as GitHub Pages or Netlify and open it from there.'+link;
      }else{
        n.textContent='This video cannot be played here. Skipping to the next one…';
        setTimeout(()=>play(idx+1),1200);
      }
    }}});
};

aud.addEventListener('play',()=>{if(cur==='au'){S.playing=true;pp.innerHTML=PAUSE}});
aud.addEventListener('pause',()=>{if(cur==='au'){S.playing=false;pp.innerHTML=PLAY}});
aud.addEventListener('ended',()=>{if(cur==='au')autoNext()});
aud.addEventListener('error',()=>{if(cur==='au'&&aud.src)$('now').textContent='This track failed to load. Try another result.'});

setInterval(()=>{
  if(idx<0)return;
  let c,d;
  if(cur==='au'){c=aud.currentTime;d=aud.duration}
  else if(ytReady&&yt&&yt.getCurrentTime){c=yt.getCurrentTime();d=yt.getDuration()}
  else return;
  if(!seeking&&d)seek.value=c/d*1000;
  if(d&&c>=0)S.prog=Math.min(1,c/d);
  tm.textContent=fmt(c);
},250);

pp.onclick=()=>{
  if(cur==='au'){aud.paused?aud.play():aud.pause()}
  else if(ytReady){yt.getPlayerState()===1?yt.pauseVideo():yt.playVideo()}
};
$('prev').onclick=prevTrack;
$('next').onclick=nextTrack;
seek.addEventListener('input',()=>{seeking=true});
seek.addEventListener('change',()=>{
  if(cur==='au'){if(aud.duration)aud.currentTime=seek.value/1000*aud.duration}
  else if(ytReady){const d=yt.getDuration();if(d)yt.seekTo(seek.value/1000*d,true)}
  seeking=false;
});

const safeName=n=>String(n).replace(/[\\/:*?"<>|]/g,'');
dl.addEventListener('click',async e=>{
  e.preventDefault();
  const url=dl.href,name=(dl.dataset.name||'track')+'.mp3',n=$('now'),old=n.textContent;
  n.textContent='Preparing download…';
  try{
    const r=await fetch(url);
    if(!r.ok)throw new Error('server said '+r.status);
    const blob=await r.blob(),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),10000);
    n.textContent='Download started: '+name;
  }catch(err){
    if(/server said/.test(String(err.message)))n.textContent='This track cannot be downloaded ('+err.message+'). The artist may have restricted it.';
    else{window.open(url,'_blank','noopener');n.textContent=old}
  }
});

async function searchYT(q){
  const u='https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&videoEmbeddable=true&maxResults=15&q='+encodeURIComponent(q)+'&key='+KEY;
  const r=await fetch(u),d=await r.json();
  if(!r.ok){
    const why=d.error&&d.error.errors&&d.error.errors[0]&&d.error.errors[0].reason;
    throw new Error(why==='quotaExceeded'?'the daily YouTube search limit is used up, try again tomorrow or use Audius':(d.error&&d.error.message)||'request failed');
  }
  return (d.items||[]).filter(i=>i.id&&i.id.videoId).map(i=>({
    src:'yt',id:i.id.videoId,title:decode(i.snippet.title),ch:decode(i.snippet.channelTitle),
    img:(i.snippet.thumbnails&&i.snippet.thumbnails.default&&i.snippet.thumbnails.default.url)||'',dl:false}));
}
async function searchAU(q){
  const r=await fetch(API+'/tracks/search?limit=20&query='+encodeURIComponent(q)+'&app_name='+APP);
  if(!r.ok)throw new Error('Audius returned '+r.status);
  const d=await r.json();
  return (d.data||[]).filter(t=>t.id&&t.is_streamable!==false).map(t=>({
    src:'au',id:t.id,title:t.title,ch:(t.user&&t.user.name)||'',
    img:px((t.artwork&&(t.artwork['150x150']||t.artwork['480x480']))||''),
    dl:(t.is_downloadable===true||!!(t.download&&t.download.is_downloadable===true))&&!(t.download&&t.download.requires_follow===true),
    dlUrl:PROXY?'':((t.download&&t.download.url)||'')}));
}

async function doSearch(advance){
  const q=$('q').value.trim();
  if(!q)return;
  $('msg').textContent='Searching '+(source==='yt'?'YouTube':'Audius')+'…';
  try{
    inFavs=false;addRecent(q);results=await cached(source,q,()=>source==='yt'?searchYT(q):searchAU(q));
    idx=-1;
    render();
    $('msg').textContent=results.length?'':'Nothing out there. Try different words.';
    if(results.length)play(0);
  }catch(err){$('msg').textContent='Search failed: '+err.message+'.'}
}
$('f').addEventListener('submit',e=>{e.preventDefault();doSearch(true)});

function render(){
  const ul=$('list');ul.innerHTML='';
  results.forEach((v,i)=>{
    const li=document.createElement('li'),b=document.createElement('button');
    li.style.animationDelay=(i*45)+'ms';
    b.type='button';b.dataset.i=i;
    b.innerHTML='<img alt=""><div><b></b><span></span></div>';
    if(v.img)b.querySelector('img').src=v.img;
    b.querySelector('b').textContent=v.title;
    b.querySelector('span').textContent=v.ch+(v.dl?' · free download':'');
    b.onclick=()=>play(i);
    li.appendChild(b);ul.appendChild(li);
  });
}

function play(i,retry){
  if(i<0||i>=results.length)return;
  if(!retry){S.focus=((S.focus+2)%(PL.length+1))-1;S.target=S.focus>=0?PL[S.focus].h:210;S.prog=0;S.pe=0}
  const v=results[i];
  idx=i;cur=v.src;S.pulse=1;
  document.querySelectorAll('li button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
  bar.style.display='flex';afterPlay(v);
  $('now').textContent='Now playing: '+v.title+' by '+v.ch;
  if(v.src==='au'&&v.dl){dl.href=v.dlUrl||(API+'/tracks/'+encodeURIComponent(v.id)+'/download?app_name='+APP+'&filename='+encodeURIComponent(safeName(v.title)+'.mp3'));dl.dataset.name=safeName(v.title);dl.style.display='flex'}
  else dl.style.display='none';
  if(v.src==='yt'){
    aud.pause();
    $('ytwrap').style.display='block';
    if(ytReady)yt.loadVideoById(v.id);else pending=i;
  }else{
    if(ytReady)yt.stopVideo();
    pending=null;
    $('ytwrap').style.display='none';
    aud.src=API+'/tracks/'+encodeURIComponent(v.id)+'/stream?app_name='+APP;
    aud.play().catch(()=>{$('now').textContent='Tap play to start: '+v.title});
  }
}

/* ---------- extras: favourites, shuffle/repeat, lock screen, sleep, sharing, cache, install ---------- */
const NAV=typeof navigator!=='undefined'?navigator:{};
let favs=[],inFavs=false,ct=null,shuf=false,rep=0,slT=null,sli=0,ip=null;
try{favs=JSON.parse(localStorage.getItem('tf_favs')||'[]')}catch(e){}
const saveFavs=()=>{try{localStorage.setItem('tf_favs',JSON.stringify(favs))}catch(e){}};
const isFav=v=>!!v&&favs.some(f=>f.src===v.src&&f.id===v.id);
function paintFav(){$('fav').innerHTML=isFav(ct)?'&#x2665;&#xFE0E;':'&#x2661;&#xFE0E;';$('fav').classList.toggle('on',isFav(ct))}
$('fav').onclick=()=>{
  if(!ct)return;
  if(isFav(ct))favs=favs.filter(f=>!(f.src===ct.src&&f.id===ct.id));else favs.unshift(ct);
  saveFavs();paintFav();
  if(inFavs){results=favs.slice();idx=results.findIndex(r=>r.src===ct.src&&r.id===ct.id);render()}
};
function showFavs(){
  inFavs=true;results=favs.slice();idx=-1;render();
  $('msg').textContent=favs.length?'':'Nothing saved yet. Tap the heart on a song to keep it here.';
}

/* next / previous / shuffle / repeat */
function pick(d){
  if(!results.length)return -1;
  if(shuf&&results.length>1){let j;do{j=Math.floor(Math.random()*results.length)}while(j===idx);return j}
  const j=idx+d;if(j>=results.length)return rep===1?0:-1;return Math.max(j,0);
}
function autoNext(){if(rep===2){S.prog=0;play(idx,true);return}const j=pick(1);if(j>=0)play(j)}
function nextTrack(){const j=pick(1);if(j>=0)play(j)}
function prevTrack(){play(idx>0?idx-1:0)}
$('shuf').onclick=()=>{shuf=!shuf;$('shuf').classList.toggle('on',shuf)};
$('rep').onclick=()=>{rep=(rep+1)%3;$('rep').classList.toggle('on',rep>0);$('rep').innerHTML=rep===2?'1':'&#x21BB;&#xFE0E;'};

/* volume + sleep timer */
$('vol').oninput=e=>{const v=e.target.value/100;aud.volume=v;if(ytReady)yt.setVolume(v*100)};
$('slp').onclick=()=>{
  sli=(sli+1)%4;clearTimeout(slT);const m=[0,15,30,60][sli];
  $('slp').textContent=m?m:'\u23F2\uFE0E';$('slp').classList.toggle('on',!!m);
  if(m)slT=setTimeout(()=>{aud.pause();if(ytReady)yt.pauseVideo();sli=0;$('slp').textContent='\u23F2\uFE0E';$('slp').classList.remove('on')},m*60000);
};

/* lock-screen / notification controls */
function afterPlay(v){
  ct=v;$('tools').style.display='flex';paintFav();
  if(NAV.mediaSession&&typeof MediaMetadata!=='undefined')NAV.mediaSession.metadata=new MediaMetadata({title:v.title,artist:v.ch,artwork:v.img?[{src:v.img}]:[]});
}
if(NAV.mediaSession){
  const h=(a,f)=>{try{NAV.mediaSession.setActionHandler(a,f)}catch(e){}};
  h('play',()=>{if(!S.playing)pp.onclick()});h('pause',()=>{if(S.playing)pp.onclick()});
  h('previoustrack',prevTrack);h('nexttrack',nextTrack);
  h('seekto',d=>{if(cur==='au')aud.currentTime=d.seekTime;else if(ytReady)yt.seekTo(d.seekTime,true)});
  setInterval(()=>{NAV.mediaSession.playbackState=S.playing?'playing':'paused'},500);
}

/* keyboard */
addEventListener('keydown',e=>{
  const t=e.target;if(t&&t.tagName==='INPUT'&&t.type!=='range')return;
  const k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='n'||k==='arrowright')nextTrack();
  else if(k==='p'||k==='arrowleft')prevTrack();
  else if(k==='f')$('fav').onclick();
  else if(k==='s')$('shuf').onclick();
  else if(k==='m'){aud.muted=!aud.muted;if(ytReady)aud.muted?yt.mute():yt.unMute()}
});

/* mood shortcuts */
document.querySelectorAll('#moods button[data-m]').forEach(b=>b.onclick=()=>{$('q').value=b.dataset.m;doSearch(false)});

/* recent searches + saved YouTube results (spares the daily limit) */
function fillRec(r){const d=$('rec');d.innerHTML=r.map(x=>'<option value="'+x.replace(/"/g,'&quot;')+'">').join('')}
function addRecent(q){let r=[];try{r=JSON.parse(localStorage.getItem('tf_rec')||'[]')}catch(e){}r=[q].concat(r.filter(x=>x!==q)).slice(0,8);try{localStorage.setItem('tf_rec',JSON.stringify(r))}catch(e){}fillRec(r)}
try{fillRec(JSON.parse(localStorage.getItem('tf_rec')||'[]'))}catch(e){}
async function cached(s,q,fn){
  if(s!=='yt')return fn();
  const k='tf_c:'+q.toLowerCase();
  try{const c=JSON.parse(localStorage.getItem(k)||'null');if(c&&Date.now()-c.t<216e5)return c.d}catch(e){}
  const d=await fn();
  try{localStorage.setItem(k,JSON.stringify({t:Date.now(),d}))}catch(e){try{Object.keys(localStorage).filter(x=>x.indexOf('tf_c:')===0).forEach(x=>localStorage.removeItem(x))}catch(_){}}
  return d;
}

/* sharing: a link that carries a song or your whole saved list */
const enc=l=>btoa(unescape(encodeURIComponent(JSON.stringify(l.map(v=>[v.src,v.id,v.title,v.ch])))));
$('shr').onclick=async()=>{
  const l=inFavs&&favs.length?favs:(ct?[ct]:[]);if(!l.length)return;
  const url=location.origin+location.pathname+'#l='+enc(l);
  try{if(NAV.share)await NAV.share({title:'Tune Finder',url});else{await NAV.clipboard.writeText(url);$('now').textContent='Link copied'}}catch(e){}
};
(function(){
  const h=location.hash;if(h.indexOf('#l=')!==0)return;
  try{
    results=JSON.parse(decodeURIComponent(escape(atob(h.slice(3))))).map(a=>({src:a[0],id:a[1],title:a[2],ch:a[3],img:'',dl:false,dlUrl:''}));
    idx=-1;render();$('msg').textContent='Shared with you. Tap a song to play.';
  }catch(e){}
})();

if(PROXY&&document.querySelector){const a=document.querySelector('#src button[data-s="au"]');if(a)a.click()}   // behind a relay, start on Audius

addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('inst').style.display='inline-block'});
$('inst').onclick=()=>{if(ip){ip.prompt();ip=null;$('inst').style.display='none'}};
if('serviceWorker' in NAV&&/^https?:$/.test(location.protocol))NAV.serviceWorker.register('sw.js').catch(()=>{});
